body{display:flex;align-items:center;justify-content:center}

canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

.btn.alt{background:linear-gradient(180deg,#5fd48a,#2bab5b);box-shadow:0 .3em 0 #17703a,0 .6em 1em #0006;color:#fff;font-size:1.05em;padding:.7em 1.8em}

function flagDraw2(g,sp,r){
  const F=(c,x,y,w,h)=>{g.fillStyle=c;g.fillRect(x,y,w,h)};
  if(sp.bg)F(sp.bg,-r,-r,2*r,2*r);
  if(sp.s){const w=sp.w||sp.s.map(()=>1),T=w.reduce((a,b)=>a+b,0);let p=-r;sp.s.forEach((c,i)=>{const L=2*r*w[i]/T;sp.v?F(c,p,-r,L+.5,2*r):F(c,-r,p,2*r,L+.5);p+=L})}
  if(sp.cn)F(sp.cn,-r,-r,r,r*.95);
  if(sp.tri){g.fillStyle=sp.tri;g.beginPath();g.moveTo(-r,-r);g.lineTo(0,0);g.lineTo(-r,r);g.fill()}
  if(sp.dia){g.fillStyle=sp.dia;g.beginPath();g.moveTo(-r*.85,0);g.lineTo(0,-r*.6);g.lineTo(r*.85,0);g.lineTo(0,r*.6);g.fill()}
  if(sp.cr){const[c,cx,ic]=sp.cr,t=r*.3;F(c,cx*r-t/2,-r,t,2*r);F(c,-r,-t/2,2*r,t);if(ic){const u=t*.5;F(ic,cx*r-u/2,-r,u,2*r);F(ic,-r,-u/2,2*r,u)}}
  if(sp.plus){const t=r*.3;F(sp.plus,-t/2,-r*.55,t,r*1.1);F(sp.plus,-r*.55,-t/2,r*1.1,t)}
  if(sp.x){g.strokeStyle=sp.x;g.lineWidth=r*.3;g.beginPath();g.moveTo(-r,-r);g.lineTo(r,r);g.moveTo(r,-r);g.lineTo(-r,r);g.stroke()}
  [sp.d,sp.d2].forEach(d=>{if(d){g.fillStyle=d[0];g.beginPath();g.arc(d[1]*r,d[2]*r,d[3]*r,0,7);g.fill()}});
}

function startLevel(i){
  cur=i;const cup=Math.floor(i/LV),r=mul(i*977+13),col=CUPS[cup][1];
  goal={x:W/2,w:Math.max(70,120-i*2),base:W/2,amp:i>=10?Math.min(100,15+i*2):0,spd:.02};
  bumpers=[];const n=Math.min(2+Math.floor(i/4),7);let tries=0;
  while(bumpers.length<n&&tries++<500){
    const rr=17+r()*8,x=rr+20+r()*(W-2*rr-40),y=190+r()*(H-380);
    if(bumpers.every(b=>Math.hypot(b.bx-x,b.by-y)>b.r+rr+64))bumpers.push({bx:x,by:y,x,y,r:rr,col,hit:0,amp:0});
  }
  if(i>=3)bumpers.push({bx:W/2,by:92,x:W/2,y:92,r:15,col:'#39d353',hit:0,amp:Math.min(120,50+i*3),sp:.03+i*.0008});
  if(i>=14)bumpers[0].amp=50,bumpers[0].sp=.025;
  taken=0;combo=0;parts=[];pops=[];ts=1;slow=0;state='play';paused=false;resetBall();
  $('hdn').textContent='LEVEL '+(i+1);dots();show('game');
}
function dots(){$('dots').textContent='●'.repeat(Math.max(SHOTS-taken,0))+'○'.repeat(Math.min(taken,SHOTS))}

function burst(x,y,h){for(let i=0;i<10;i++)parts.push({x,y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,l:25,h})}

function step(b,sim,k){
  b.x+=b.vx*k;b.y+=b.vy*k;let hits=0;
  if(b.x<R){b.x=R;b.vx=Math.abs(b.vx);hits++}
  if(b.x>W-R){b.x=W-R;b.vx=-Math.abs(b.vx);hits++}
  if(b.y>H-R){b.y=H-R;b.vy=-Math.abs(b.vy);hits++}
  if(b.y<TOP+R){if(Math.abs(b.x-goal.x)<goal.w/2-R/2)return 'goal';b.y=TOP+R;b.vy=Math.abs(b.vy);hits++}
  for(const o of bumpers){
    const dx=b.x-o.x,dy=b.y-o.y,dd=Math.hypot(dx,dy),m=o.r+R;
    if(dd<m){
      const nx=dx/dd,ny=dy/dd,dot=b.vx*nx+b.vy*ny;
      if(dot<0){b.vx-=2*dot*nx;b.vy-=2*dot*ny}
      b.vx*=1.03;b.vy*=1.03;b.x=o.x+nx*m;b.y=o.y+ny*m;hits++;
      if(!sim){o.hit=1;burst(b.x,b.y,50);pops.push({x:o.x,y:o.y-o.r-8,t:40,s:'x'+(combo+1)});if(combo>=3)slow=Math.max(slow,16);snd(300+combo*50,.07,'triangle')}
    }
  }
  if(!sim&&hits){combo+=hits;if(!bumpers.some(o=>o.hit>.9))snd(220,.04,'square',.04)}
  return hits?'hit':null;
}
function update(){
  if(!goal)return;t++;goal.x=goal.base+Math.sin(t*goal.spd)*goal.amp;
  bumpers.forEach(o=>{o.hit*=.9;if(o.amp)o.x=o.bx+Math.sin(t*(o.sp||.03))*o.amp});
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.l--});parts=parts.filter(p=>p.l>0);
  pops.forEach(p=>{p.y-=.6;p.t--});pops=pops.filter(p=>p.t>0);
  if(state!=='play'||paused||!ball.moving){ts=1;return}
  const near=ball.y<170&&ball.vy<0&&Math.abs(ball.x-goal.x)<goal.w/2+30;
  if(slow>0)slow--;ts=1;
  const sub=4,k=ts/sub;
  for(let i=0;i<sub;i++)if(step(ball,false,k)==='goal'){win();return}
  ball.rot+=Math.hypot(ball.vx,ball.vy)*.05*ts;
  const f=Math.pow(.997,ts);ball.vx*=f;ball.vy*=f;
  if(Math.hypot(ball.vx,ball.vy)<.35){if(taken>=SHOTS)finish(false);else resetBall()}
}
function win(){
  const left=SHOTS-taken,st=left>=3?3:left===2?2:1,coins=10+st*10+Math.min(combo,10)*2+(combo>=5?25:0);if(combo>=5)pops.push({x:W/2,y:H/2,t:90,s:'COMBO BONUS +25'});
  for(let i=0;i<40;i++)parts.push({x:goal.x,y:TOP,vx:(Math.random()-.5)*8,vy:Math.random()*5,l:40,h:30+Math.random()*30});
  snd(523,.15);setTimeout(()=>snd(659,.15),120);setTimeout(()=>snd(784,.25),240);
  save.stars[cur]=Math.max(save.stars[cur],st);save.coins+=coins;persist();
  state='done';ball.moving=false;setTimeout(()=>finish(true,st,coins),700);
}

}

  ctx.strokeStyle='#ffffffaa';ctx.lineWidth=2;ctx.strokeRect(2,TOP,W-4,H-TOP-2);
  ctx.beginPath();ctx.moveTo(2,H/2);ctx.lineTo(W-2,H/2);ctx.stroke();ctx.beginPath();ctx.arc(W/2,H/2,56,0,7);ctx.stroke();
  ctx.strokeRect(W/2-90,TOP,180,70);ctx.strokeRect(W/2-90,H-72,180,70);
  ctx.fillStyle='#0004';ctx.fillRect(goal.x-goal.w/2,0,goal.w,TOP);
  ctx.strokeStyle='#ffffff66';ctx.lineWidth=1;
  for(let x=goal.x-goal.w/2;x<=goal.x+goal.w/2;x+=8){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,TOP);ctx.stroke()}
  for(let y=6;y<TOP;y+=7){ctx.beginPath();ctx.moveTo(goal.x-goal.w/2,y);ctx.lineTo(goal.x+goal.w/2,y);ctx.stroke()}
  ctx.fillStyle='#fff';ctx.fillRect(goal.x-goal.w/2-4,0,4,TOP+2);ctx.fillRect(goal.x+goal.w/2,0,4,TOP+2);
  bumpers.forEach(o=>{
    ctx.shadowColor='#000';ctx.shadowBlur=8;ctx.fillStyle=o.col;ctx.beginPath();ctx.arc(o.x,o.y,o.r+o.hit*4,0,7);ctx.fill();ctx.shadowBlur=0;
    ctx.strokeStyle='#0008';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#e8b98a';ctx.beginPath();ctx.arc(o.x,o.y-o.r*.15,o.r*.32,0,7);ctx.fill();
  });
  if(aim&&state==='play'&&!ball.moving){
    ctx.fillStyle='#fff';predict().forEach(([x,y],i)=>{ctx.globalAlpha=1-i/26;ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.fill()});ctx.globalAlpha=1;
    ctx.strokeStyle='#fff8';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(ball.x,ball.y);ctx.lineTo(ball.x-aim.vx*5,ball.y-aim.vy*5);ctx.stroke();
  }
  ballDraw2(ball);
  parts.forEach(p=>{ctx.globalAlpha=p.l/40;ctx.fillStyle=`hsl(${p.h} 90% 60%)`;ctx.fillRect(p.x,p.y,4,4)});ctx.globalAlpha=1;
  ctx.textAlign='center';ctx.font='bold 18px system-ui';
  pops.forEach(p=>{ctx.globalAlpha=Math.min(1,p.t/20);ctx.fillStyle='#fff';ctx.strokeStyle='#000a';ctx.lineWidth=3;ctx.strokeText(p.s,p.x,p.y);ctx.fillText(p.s,p.x,p.y)});ctx.globalAlpha=1;
  if(combo>1&&state==='play'){ctx.fillStyle='#ffd54a';ctx.font='bold 24px system-ui';ctx.strokeStyle='#000a';ctx.strokeText('COMBO x'+combo,W/2,H-100);ctx.fillText('COMBO x'+combo,W/2,H-100)}
  if(cur===0&&taken===0&&!ball.moving){ctx.fillStyle='#fffc';ctx.font='bold 16px system-ui';ctx.fillText('DRAG BACK FROM THE BALL, THEN RELEASE',W/2,H-130)}
  
}
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*704/r.height-OY}}
cv.addEventListener('pointerdown',e=>{if(mode!=='game'||paused||state!=='play'||ball.moving)return;const p=pos(e);aim={sx:p.x,sy:p.y,vx:0,vy:0}});
cv.addEventListener('pointermove',e=>{
  if(!aim)return;const p=pos(e);let dx=(aim.sx-p.x)*.15,dy=(aim.sy-p.y)*.15;const m=Math.hypot(dx,dy);
  if(m>26){dx*=26/m;dy*=26/m}aim.vx=dx;aim.vy=dy;
});
cv.addEventListener('pointerup',()=>{
  if(!aim)return;
  if(Math.hypot(aim.vx,aim.vy)>2){ball.vx=aim.vx;ball.vy=aim.vy;ball.moving=true;combo=0;taken++;dots();snd(240,.1,'triangle',.1)}
  aim=null;
});
cv.addEventListener('pointercancel',()=>aim=null);
show('home');
(function loop(){requestAnimationFrame(loop);try{update();draw()}catch(e){console.error(e)}})();
</script>
</body>
